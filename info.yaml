# ============================================================================
#  Smart Vending Machine — Project Metadata
#  File: info.yaml
# ============================================================================

project:
  name: Smart Vending Machine with Adaptive Change System
  version: "3.0"
  description: >
    Fully synthesizable RTL Verilog implementation of a smart vending machine.
    Supports multiple products, adaptive greedy change optimizer, 7-segment
    display, coin inventory management, cancel/refund FSM, and complete
    testbench with waveform output.

  status: synthesizable          # ready for fabrication
  license: MIT
  language: Verilog-2012
  timescale: 1ns/1ps

# ── Design Parameters ────────────────────────────────────────────────────────
design:
  top_module: smart_vending_machine
  clock_freq_mhz: 100
  reset_polarity: active_low      # rst_n
  reset_type: asynchronous

  coins:
    - denom: 1
      encoding: "2'b00"
    - denom: 2
      encoding: "2'b01"
    - denom: 5
      encoding: "2'b10"
    - denom: 10
      encoding: "2'b11"

  products:
    - id: A
      encoding: "2'b00"
      price: 5
    - id: B
      encoding: "2'b01"
      price: 7
    - id: C
      encoding: "2'b10"
      price: 9
    - id: D
      encoding: "2'b11"
      price: 10

  display:
    type: 7-segment
    digits: 2
    encoding: active_high
    bit_order: "{g, f, e, d, c, b, a}"

# ── FSM ──────────────────────────────────────────────────────────────────────
fsm:
  states:
    - id: 0
      name: IDLE
      encoding: "3'd0"
      description: Waiting for first coin and valid product selection

    - id: 1
      name: ACCEPT
      encoding: "3'd1"
      description: Accumulating coins; checks vs. price each cycle

    - id: 2
      name: DISPENSE
      encoding: "3'd2"
      description: Pulses dispense_product; calculates change required

    - id: 3
      name: CALC_CHANGE
      encoding: "3'd3"
      description: Starts change_optimizer; waits for done signal

    - id: 4
      name: GIVE_CHANGE
      encoding: "3'd4"
      description: Sequentially subtracts coins from inventory (4 steps)

    - id: 5
      name: REFUND
      encoding: "3'd5"
      description: Returns all inserted coins via change_optimizer

    - id: 6
      name: ERROR
      encoding: "3'd6"
      description: Insufficient change coins; holds until rst_n

  transitions:
    - from: IDLE        to: ACCEPT        condition: "total > 0 && valid_sel"
    - from: ACCEPT      to: DISPENSE      condition: "total >= price"
    - from: ACCEPT      to: REFUND        condition: "cancel_btn"
    - from: DISPENSE    to: IDLE          condition: "total == price (exact)"
    - from: DISPENSE    to: CALC_CHANGE   condition: "total > price"
    - from: CALC_CHANGE to: GIVE_CHANGE   condition: "change_done && !change_error"
    - from: CALC_CHANGE to: ERROR         condition: "change_done && change_error"
    - from: GIVE_CHANGE to: IDLE          condition: "all denominations dispatched"
    - from: REFUND      to: GIVE_CHANGE   condition: "change_done && !change_error"
    - from: REFUND      to: ERROR         condition: "change_done && change_error"
    - from: ERROR       to: IDLE          condition: "rst_n (hardware reset only)"

# ── Module Hierarchy ─────────────────────────────────────────────────────────
modules:
  - name: smart_vending_machine
    type: top
    file: project.v
    instance: —

  - name: coin_decoder
    type: registered
    file: project.v
    instance: u_dec
    latency_cycles: 1
    description: "coin_type[1:0] → coin_value[3:0] + value_valid strobe"

  - name: money_accumulator
    type: registered
    file: project.v
    instance: u_acc
    width_bits: 8
    max_value: 255
    description: Saturating 8-bit running total; clears on clear_acc

  - name: product_selector
    type: combinational
    file: project.v
    instance: u_prod
    description: "prod_sel[1:0] → price[3:0] + valid_sel"

  - name: coin_inventory
    type: registered
    file: project.v
    instance: u_inv
    storage: "4 × 4-bit registers"
    init_float:
      d1:  10
      d2:  8
      d5:  6
      d10: 4
    description: Coin stock tracker; add on insert, subtract on change

  - name: change_optimizer
    type: multi_cycle_fsm
    file: project.v
    instance: u_opt
    algorithm: greedy_highest_first
    worst_case_cycles: 6
    description: Computes minimum-coin change plan from available inventory

  - name: bcd_converter
    type: combinational
    file: project.v
    instance: u_bcd
    algorithm: double_dabble_unrolled
    description: 8-bit binary → BCD tens + units digits

  - name: seg7_driver
    type: combinational
    file: project.v
    instances: [u_seg_t, u_seg_u]
    encoding: active_high
    description: BCD digit (0–9) → 7-segment {g,f,e,d,c,b,a}

  - name: fsm_controller
    type: registered
    file: project.v
    instance: u_fsm
    states: 7
    description: Master transaction FSM coordinating all sub-modules

# ── Port List (Top Module) ────────────────────────────────────────────────────
ports:
  inputs:
    - name: clk
      width: 1
      description: System clock

    - name: rst_n
      width: 1
      description: Active-low asynchronous reset

    - name: coin_valid
      width: 1
      description: 1-cycle pulse — coin has been inserted

    - name: coin_type
      width: 2
      description: "Denomination: 00=₹1  01=₹2  10=₹5  11=₹10"

    - name: prod_sel
      width: 2
      description: "Product: 00=A(₹5)  01=B(₹7)  10=C(₹9)  11=D(₹10)"

    - name: cancel_btn
      width: 1
      description: 1-cycle pulse — cancel transaction / request refund

  outputs:
    - name: seg_tens
      width: 7
      description: 7-segment tens digit of total (active-high)

    - name: seg_units
      width: 7
      description: 7-segment units digit of total (active-high)

    - name: dispense_product
      width: 1
      description: 1-cycle pulse — product has been vended

    - name: dispense_item
      width: 2
      description: Which product was dispensed (matches prod_sel encoding)

    - name: led_insert
      width: 1
      description: Asserted in IDLE — machine waiting for coins

    - name: led_ready
      width: 1
      description: Enough money inserted for selected product

    - name: led_busy
      width: 1
      description: Transaction in progress

    - name: led_error
      width: 1
      description: Change error — call attendant (cleared only by rst_n)

    - name: led_refund
      width: 1
      description: Refund in progress

    - name: dbg_state
      width: 3
      description: Current FSM state (debug / scan-chain port)

    - name: dbg_total
      width: 8
      description: Current accumulated total (debug / scan-chain port)

# ── Testbench ────────────────────────────────────────────────────────────────
testbench:
  file: tb.v
  module: tb_smart_vending
  clock_period_ns: 10
  vcd_output: vending.vcd

  test_cases:
    - id: TC1
      description: "Product A (₹5), 5×₹1 → exact change"
      expected: dispense, total=0, no change coins needed

    - id: TC2
      description: "Product B (₹7), ₹10 → change ₹3 (₹2+₹1)"
      expected: dispense, change plan disp_d2=1 disp_d1=1

    - id: TC3
      description: "Product C (₹9), ₹5+₹5 → change ₹1"
      expected: dispense, change plan disp_d1=1

    - id: TC4
      description: "Product D (₹10), ₹2+₹2 then CANCEL → refund ₹4"
      expected: refund, total=0, led_refund pulsed

    - id: TC5
      description: "Product D (₹10), ₹10 → exact"
      expected: dispense, total=0, no change

    - id: TC6
      description: "7-seg: insert ₹10+₹2 → display 12"
      expected: "seg_tens=0b0000110, seg_units=0b1011011"

    - id: TC7
      description: "Stress: 5 consecutive Product B purchases"
      expected: all succeed, inventory decrements correctly

    - id: TC8
      description: "Partial payment → stays in ACCEPT until total >= price"
      expected: state=ACCEPT after ₹2, dispense after ₹5 total

# ── Synthesis Targets ─────────────────────────────────────────────────────────
synthesis:
  tools:
    - name: Yosys
      command: "make synth"
      output: synth_out.json

    - name: OpenLane / Sky130
      command: "make synth_sky130"
      pdk: sky130A
      standard_cells: sky130_fd_sc_hd

    - name: Quartus (Intel FPGA)
      notes: >
        Create new project, add project.v, set top module to
        smart_vending_machine, compile normally.

    - name: Vivado (Xilinx FPGA)
      notes: >
        Add project.v as source, set top to smart_vending_machine,
        run synthesis. All constructs are Vivado-compatible.

# ── Files ─────────────────────────────────────────────────────────────────────
files:
  - path: project.v
    role: rtl_source
    description: Complete synthesizable RTL (all 9 modules)

  - path: tb.v
    role: testbench
    description: Verilog testbench with 8 test cases + waveform dump

  - path: test.py
    role: verification
    description: Python behavioural model + 11 test cases + cocotb hooks

  - path: Makefile
    role: build_system
    description: sim / wave / pytest / cocotb / synth / lint / clean targets

  - path: info.yaml
    role: metadata
    description: This file — machine-readable project metadata

  - path: info.md
    role: documentation
    description: Human-readable documentation and quick-start guide
