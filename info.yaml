# # Do not change!
# yaml_version: 6
# Tiny Tapeout project information
project:
  title:        "Smart Vending Machine"      # Project title
  author:       "mandalaganesh633-ai"       # Your name
  discord:      ""      # Your discord username (optional)
  description:  "Digital vending machine with coin inventory tracking and change optimization."      # One line description
  language:     "Verilog" # Design language
  clock_hz:     10000000  # 10 MHz standard clock

  # How many tiles your design occupies? 
  tiles: "1x1"          # Fits comfortably in 1x1

  # Your top module name:
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Matches the project.v logic.
pinout:
  # Inputs (ui_in)
  ui[0]: "coin_valid"
  ui[1]: "coin_type_bit0"
  ui[2]: "coin_type_bit1"
  ui[3]: "prod_sel_bit0"
  ui[4]: "prod_sel_bit1"
  ui[5]: "cancel_btn"
  ui[6]: ""
  ui[7]: ""

  # Outputs (uo_out)
  uo[0]: "seg_units_a"
  uo[1]: "seg_units_b"
  uo[2]: "seg_units_c"
  uo[3]: "seg_units_d"
  uo[4]: "seg_units_e"
  uo[5]: "seg_units_f"
  uo[6]: "seg_units_g"
  uo[7]: "dispense_product"

  # Bidirectional pins (uio_out) - Configured as outputs
  uio[0]: "seg_tens_a"
  uio[1]: "seg_tens_b"
  uio[2]: "seg_tens_c"
  uio[3]: "seg_tens_d"
  uio[4]: "seg_tens_e"
  uio[5]: "seg_tens_f"
  uio[6]: "seg_tens_g"
  uio[7]: "led_busy"

# Do not change!
yaml_version: 6
