# Tiny Tapeout project information
project:
  title:        "Smart Vending Machine"
  author:       "mandalaganesh633-ai"
  discord:      ""
  description:  "A digital vending machine that accepts coins, selects products, and drives a 7-segment display showing the current balance."
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x1"

  top_module:  "tt_um_example"

  source_files:
    - "project.v"

# Pinout matches project.v exactly
pinout:
  # Inputs
  ui[0]: "coin_valid"
  ui[1]: "coin_type_bit0"
  ui[2]: "coin_type_bit1"
  ui[3]: "prod_sel_bit0"
  ui[4]: "prod_sel_bit1"
  ui[5]: "cancel_btn"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "seg_units_a"
  uo[1]: "seg_units_b"
  uo[2]: "seg_units_c"
  uo[3]: "seg_units_d"
  uo[4]: "seg_units_e"
  uo[5]: "seg_units_f"
  uo[6]: "seg_units_g"
  uo[7]: "dispense_product"

  # Bidirectional (all outputs)
  uio[0]: "seg_tens_a"
  uio[1]: "seg_tens_b"
  uio[2]: "seg_tens_c"
  uio[3]: "seg_tens_d"
  uio[4]: "seg_tens_e"
  uio[5]: "seg_tens_f"
  uio[6]: "seg_tens_g"
  uio[7]: "led_busy"

# Do not change!
yaml_version: 6
